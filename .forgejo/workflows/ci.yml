name: "CI/CD & Sovereign Release to Banca"

on:
  push:
    tags:
      - 'v*'
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    name: "Checks, Tests & Quality Gates"
    runs-on: ubuntu-latest
    container:
      image: gambi.2lp.in/lumen/gost-ci-cross:latest
    steps:
      - name: "Checkout repository"
        uses: https://github.com/actions/checkout@v4
        with:
          fetch-depth: 0

      - name: "Configure Sovereign Gambi Cargo Registry"
        run: |
          mkdir -p "$HOME/.cargo"
          printf '[registries.gambi]\nindex = "sparse+https://gambi.2lp.in/api/packages/lumen/cargo/"\n' > "$HOME/.cargo/config.toml"
          if [ -n "${{ secrets.LUMEN_REGISTRY_TOKEN }}" ]; then
            printf '[registries.gambi]\ntoken = "${{ secrets.LUMEN_REGISTRY_TOKEN }}"\n' > "$HOME/.cargo/credentials.toml"
          fi

      - name: "Format Check"
        run: cargo fmt -- --check

      - name: "Clippy Check (Zero Warnings)"
        run: cargo clippy --all-targets -- -D warnings

      - name: "Run Unit & Integration Tests"
        run: cargo test --all-targets

      - name: "CCCP Quality Audit"
        run: |
          if command -v cccp >/dev/null 2>&1; then
            cccp check --strict || true
          fi

  deploy-banca:
    name: "Build & Publish Mocambo Multiarch to Banca"
    runs-on: ubuntu-latest
    needs: [test]
    if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')
    container:
      image: gambi.2lp.in/lumen/gost-ci-cross:latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      GIT_2LP_TOKEN: ${{ secrets.GIT_2LP_TOKEN }}
    steps:
      - name: "Checkout repository"
        uses: https://github.com/actions/checkout@v4
        with:
          fetch-depth: 0

      - name: "Configure Sovereign Gambi Cargo Registry"
        run: |
          mkdir -p "$HOME/.cargo"
          printf '[registries.gambi]\nindex = "sparse+https://gambi.2lp.in/api/packages/lumen/cargo/"\n' > "$HOME/.cargo/config.toml"
          if [ -n "${{ secrets.LUMEN_REGISTRY_TOKEN }}" ]; then
            printf '[registries.gambi]\ntoken = "${{ secrets.LUMEN_REGISTRY_TOKEN }}"\n' > "$HOME/.cargo/credentials.toml"
          fi

      - name: "Determine Version & Release Metadata"
        id: meta
        run: |
          RAW_VER=$(cat VERSION 2>/dev/null || grep -m1 '^version =' Cargo.toml | cut -d '"' -f2)
          COMMIT_HASH=$(git rev-parse --short HEAD)
          DATE_TAG=$(date -u +%Y%m%d)

          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            TAG_VER="${GITHUB_REF#refs/tags/v}"
            echo "is_stable=true" >> $GITHUB_OUTPUT
            echo "version=${TAG_VER}" >> $GITHUB_OUTPUT
            echo "channel=stable" >> $GITHUB_OUTPUT
          else
            NIGHTLY_VER="${RAW_VER}-dev.${DATE_TAG}.${COMMIT_HASH}"
            echo "is_stable=false" >> $GITHUB_OUTPUT
            echo "version=${NIGHTLY_VER}" >> $GITHUB_OUTPUT
            echo "channel=nightly" >> $GITHUB_OUTPUT
          fi
          echo "date=$(date -u +%Y-%m-%d)" >> $GITHUB_OUTPUT

      - name: "Compile Mocambo Multiarch CLI Binaries"
        run: |
          export RUSTFLAGS="-C target-feature=+crt-static"
          echo "★ [1/3] Compilando x86_64-unknown-linux-musl (Linux AMD64)..."
          cargo zigbuild --release --target x86_64-unknown-linux-musl -p mocambo || \
            cargo build --release --target x86_64-unknown-linux-musl -p mocambo

          echo "★ [2/3] Compilando aarch64-unknown-linux-musl (Linux ARM64)..."
          cargo zigbuild --release --target aarch64-unknown-linux-musl -p mocambo || \
            cargo build --release --target aarch64-unknown-linux-musl -p mocambo

          echo "★ [3/3] Compilando x86_64-pc-windows-gnu (Windows AMD64)..."
          cargo zigbuild --release --target x86_64-pc-windows-gnu -p mocambo || \
            cargo build --release --target x86_64-pc-windows-gnu -p mocambo

      - name: "Package Artifacts & Generate Checksums"
        run: |
          VERSION="${{ steps.meta.outputs.version }}"
          mkdir -p dist/packages

          if [ -d target/x86_64-unknown-linux-musl/release ]; then
            tar -czf "dist/packages/mocambo-${VERSION}-linux-amd64.tar.gz" \
              -C target/x86_64-unknown-linux-musl/release mocambo \
              -C "$PWD" README.md LICENSE 2>/dev/null || \
            tar -czf "dist/packages/mocambo-${VERSION}-linux-amd64.tar.gz" \
              -C target/x86_64-unknown-linux-musl/release mocambo
          fi

          if [ -d target/aarch64-unknown-linux-musl/release ]; then
            tar -czf "dist/packages/mocambo-${VERSION}-linux-arm64.tar.gz" \
              -C target/aarch64-unknown-linux-musl/release mocambo \
              -C "$PWD" README.md LICENSE 2>/dev/null || \
            tar -czf "dist/packages/mocambo-${VERSION}-linux-arm64.tar.gz" \
              -C target/aarch64-unknown-linux-musl/release mocambo
          fi

          if [ -d target/x86_64-pc-windows-gnu/release ]; then
            cd target/x86_64-pc-windows-gnu/release
            zip -j "$GITHUB_WORKSPACE/dist/packages/mocambo-${VERSION}-windows-amd64.zip" \
              mocambo.exe "$GITHUB_WORKSPACE/README.md" "$GITHUB_WORKSPACE/LICENSE" 2>/dev/null || \
            zip -j "$GITHUB_WORKSPACE/dist/packages/mocambo-${VERSION}-windows-amd64.zip" mocambo.exe
            cd "$GITHUB_WORKSPACE"
          fi

          cd dist/packages
          sha256sum * > SHA256SUMS
          cd "$GITHUB_WORKSPACE"

      - name: "Upload Artifacts to Cloudflare R2"
        run: |
          VERSION="${{ steps.meta.outputs.version }}"
          CHANNEL="${{ steps.meta.outputs.channel }}"

          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "Aviso: CLOUDFLARE_API_TOKEN ausente. Pulando upload R2."
            exit 0
          fi

          echo "★ Publicando artefatos versionados no R2 (twolp-bucket)..."
          for pkg in dist/packages/*; do
            filename=$(basename "$pkg")
            npx wrangler r2 object put "twolp-bucket/downloads/mocambo/${CHANNEL}/${filename}" --file="$pkg" --remote
          done

          echo "★ Publicando binários unificados em latest..."
          if [ -f target/x86_64-unknown-linux-musl/release/mocambo ]; then
            npx wrangler r2 object put "twolp-bucket/downloads/mocambo/${CHANNEL}-latest/mocambo" --file=target/x86_64-unknown-linux-musl/release/mocambo --remote
            npx wrangler r2 object put "twolp-bucket/downloads/mocambo/${CHANNEL}-latest/mocambo-linux-amd64" --file=target/x86_64-unknown-linux-musl/release/mocambo --remote
          fi
          if [ -f target/aarch64-unknown-linux-musl/release/mocambo ]; then
            npx wrangler r2 object put "twolp-bucket/downloads/mocambo/${CHANNEL}-latest/mocambo-linux-arm64" --file=target/aarch64-unknown-linux-musl/release/mocambo --remote
          fi
          if [ -f target/x86_64-pc-windows-gnu/release/mocambo.exe ]; then
            npx wrangler r2 object put "twolp-bucket/downloads/mocambo/${CHANNEL}-latest/mocambo.exe" --file=target/x86_64-pc-windows-gnu/release/mocambo.exe --remote
          fi

      - name: "Update & Rotate Release Manifest in Banca Repo"
        run: |
          VERSION="${{ steps.meta.outputs.version }}"
          CHANNEL="${{ steps.meta.outputs.channel }}"

          if [ -z "$GIT_2LP_TOKEN" ]; then
            echo "Aviso: GIT_2LP_TOKEN ausente. Pulando rotação na Banca."
            exit 0
          fi

          git clone --depth 1 "https://lumen:${GIT_2LP_TOKEN}@gambi.2lp.in/lumen/banca.git" /tmp/banca

          if [ -d "/tmp/banca/site/downloads/mocambo" ] && [ -f "/tmp/banca/scripts/rotate-downloads.py" ]; then
            cd /tmp/banca

            for ARCH in "linux-amd64" "linux-arm64" "windows-amd64"; do
              EXT="tar.gz"
              [ "$ARCH" = "windows-amd64" ] && EXT="zip"
              PKG_FILE="mocambo-${VERSION}-${ARCH}.${EXT}"
              HASH=$(sha256sum "$GITHUB_WORKSPACE/dist/packages/$PKG_FILE" 2>/dev/null | awk '{print $1}' || echo "")
              DOWNLOAD_URL="https://banca.2lp.in/downloads/mocambo/${CHANNEL}/${PKG_FILE}"

              python3 scripts/rotate-downloads.py \
                --manifest site/downloads/mocambo/index.json \
                --channel "${CHANNEL}" \
                --arch "${ARCH}" \
                --version-str "${VERSION}" \
                --url "${DOWNLOAD_URL}" \
                --sha256 "${HASH}" \
                --tarball "${PKG_FILE}" \
                --app "mocambo"
            done

            git config user.name "Mocambo Release Bot"
            git config user.email "bot@2lp.in"
            git add site/downloads/mocambo/index.json
            if ! git diff --staged --quiet; then
              git commit -m "chore(downloads): rotate mocambo release to ${VERSION} (#12)"
              git push origin main || echo "Aviso: Push do manifesto na Banca falhou."
            else
              echo "Manifesto já se encontra atualizado na Banca."
            fi
            cd "$GITHUB_WORKSPACE"
          fi

      - name: "Package APK & Pratilera Sync"
        run: |
          ./scripts/package-apk.sh || echo "Aviso: toolchain Flutter ausente neste runner"

      - name: "Trigger Pratilera Store Update"
        run: |
          if [ -n "$GIT_2LP_TOKEN" ]; then
            echo "-> Notificando a Pratilera (Banca) para atualizar o catálogo..."
            curl -s -X POST \
              -H "Authorization: token $GIT_2LP_TOKEN" \
              -H "Content-Type: application/json" \
              "https://gambi.2lp.in/api/v1/repos/lumen/banca/actions/workflows/ci.yml/dispatches" \
              -d '{"ref": "main"}' || true
          fi

  build-and-deploy-docker:
    name: "Container — Build & CD (obizero)"
    runs-on: ubuntu-latest
    needs: [test]
    if: (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')) && github.event_name == 'push'
    steps:
      - name: "Checkout repository"
        uses: https://github.com/actions/checkout@v4

      - name: "Build local Docker Image"
        run: |
          OLD_IMAGE_ID=$(docker inspect --format='{{.Id}}' gambi.2lp.in/lumen/mocambo:latest 2>/dev/null || true)
          echo "OLD_IMAGE_ID=$OLD_IMAGE_ID" >> $GITHUB_ENV
          docker build -t gambi.2lp.in/lumen/mocambo:latest -f ./Dockerfile .

      - name: "Push Image to Registry (gambi.2lp.in)"
        if: env.GAMBI_TOKEN != ''
        env:
          GAMBI_TOKEN: ${{ secrets.GAMBI_2LP_IN_TOKEN || secrets.GIT_2LP_TOKEN }}
        run: |
          echo "$GAMBI_TOKEN" | docker login -u lumen --password-stdin gambi.2lp.in
          docker push gambi.2lp.in/lumen/mocambo:latest

      - name: "CD on obizero via SSH"
        env:
          OBIZERO_SSH_HOST: ${{ secrets.OBIZERO_SSH_HOST }}
          OBIZERO_SSH_USER: ${{ secrets.OBIZERO_SSH_USER }}
          OBIZERO_SSH_KEY: ${{ secrets.OBIZERO_SSH_KEY }}
        run: |
          SSH_HOST="${OBIZERO_SSH_HOST:-172.17.0.1}"
          SSH_USER="${OBIZERO_SSH_USER:-lumen}"
          echo "-> Iniciando deploy no nó obizero ($SSH_HOST)..."

          if [ -f ~/.ssh/id_obitwo ]; then
            SSH_OPTS="-i ~/.ssh/id_obitwo -o StrictHostKeyChecking=accept-new -o ConnectTimeout=15"
          elif [ -f ~/.ssh/id_ed25519 ]; then
            SSH_OPTS="-i ~/.ssh/id_ed25519 -o StrictHostKeyChecking=accept-new -o ConnectTimeout=15"
          elif [ -n "$OBIZERO_SSH_KEY" ]; then
            mkdir -p ~/.ssh && chmod 700 ~/.ssh
            echo "$OBIZERO_SSH_KEY" > /tmp/id_ci_obizero
            chmod 600 /tmp/id_ci_obizero
            SSH_OPTS="-i /tmp/id_ci_obizero -o StrictHostKeyChecking=accept-new -o ConnectTimeout=15"
          else
            SSH_OPTS="-o StrictHostKeyChecking=accept-new -o ConnectTimeout=15"
          fi

          ssh $SSH_OPTS "$SSH_USER@$SSH_HOST" "
            set -eo pipefail
            cd ~/stacks/mocambo
            OLD_IMAGE_ID=\$(docker inspect --format='{{.Id}}' gambi.2lp.in/lumen/mocambo:latest 2>/dev/null || true)
            echo \"OLD_IMAGE_ID=\$OLD_IMAGE_ID\"

            echo '-> Aplicando atualizacao no container mocambo...'
            docker compose -f compose.yml up -d --no-build mocambo

            echo '-> Sondando estabilidade do container mocambo (polling 15s)...'
            SUCCESS=0
            for i in \$(seq 1 15); do
              STATUS=\$(docker inspect --format='{{.State.Status}}' mocambo 2>/dev/null || echo 'unknown')
              if [ \"\$STATUS\" = 'running' ]; then
                echo \"  [PASS] Container mocambo saudavel e ativo (tentativa \$i/15).\"
                SUCCESS=1
                break
              fi
              sleep 1
            done

            if [ \$SUCCESS -ne 1 ]; then
              echo '✘ [FALHA] Container nao estabilizou no prazo limite! Acionando Rollback...'
              if [ -n \"\$OLD_IMAGE_ID\" ]; then
                docker tag \"\$OLD_IMAGE_ID\" gambi.2lp.in/lumen/mocambo:latest
                docker compose -f compose.yml up -d --no-build mocambo
                echo \"✔ Rollback concluido para imagem anterior \$OLD_IMAGE_ID.\"
              fi
              exit 1
            fi

            echo '-> Limpando camadas orfas...'
            docker image prune -f
          "

