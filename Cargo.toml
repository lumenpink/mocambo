[package]
name = "mocambo"
version = "0.1.0"
edition = "2021"
authors = ["Lumen Pink <hi@lumen.pink>"]
description = "Sovereign personal cloud storage, WebDAV engine, and smart offload"
license = "GPL-3.0-or-later"
repository = "https://codeberg.org/lumenpink/mocambo"

[dependencies]
tokio = { version = "1", features = ["full"] }
axum = "0.8"
dav-server = "0.11"
rusqlite = { version = "0.33", features = ["bundled"] }
sha2 = "0.10"
hex = "0.4"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tempfile = "3.27"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
http = "1"
tower = "0.5"
tower-http = { version = "0.6", features = ["cors", "trace"] }

[dev-dependencies]
reqwest = { version = "0.12", features = ["json"] }
